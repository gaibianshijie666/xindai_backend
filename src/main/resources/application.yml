server:
  port: 8080
  # Performance
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain
  http2:
    enabled: true

spring:
  profiles:
    active: dev
  application:
    name: xindai

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xindai.xindai.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Resilience4j 熔断器配置
resilience4j:
  circuitbreaker:
    instances:
      modelService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
  retry:
    instances:
      modelService:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

# 信用额度配置
credit-limit:
  default-limit: 10000
  min-limit: 1000
  max-limit: 500000
  income-multiplier-low: 0.3
  income-multiplier-medium: 0.5
  income-multiplier-high: 0.6
  grade-multipliers:
    A: 1.5
    B: 1.3
    C: 1.1
    D: 1.0
    E: 0.8
    F: 0.6
    G: 0.4
  employment-year-multipliers:
    less-than-1: 0.8
    1-to-3: 0.9
    3-to-5: 1.0
    5-to-10: 1.1
    over-10: 1.2
  dti-adjustments:
    low: 1.0
    medium: 0.9
    high: 0.7
    very-high: 0.5

# API Rate Limiting
rate-limit:
  enabled: true
  default-limit: 100
  default-period: 60
  paths:
    /api/v1/user/login: 10/60
    /api/v1/user/register: 5/60
    /api/v1/loan/apply: 10/60

# Flowable 工作流配置
flowable:
  async-executor-activate: false
  database-schema-update: true
  process-definition-location-prefix: classpath*:/processes/

# 文件上传配置
file:
  upload:
    path: ./uploads
    max-size: 10MB
    allowed-types: image/jpeg,image/png,image/gif,application/pdf

# JWT 配置 (default fallback)
jwt:
  secret: xindai-dev-secret-key-for-jwt-token-generation-must-be-at-least-256-bits
  expiration: 7200000
