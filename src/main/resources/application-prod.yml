---
# Production Environment Configuration
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xindai}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    # Database connection pool (HikariCP)
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 30000
      pool-name: XindaiHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
    publisher-confirm-type: correlated
    publisher-returns: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT 配置 (prod - secrets from environment variables)
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}

# Knife4j 配置 (prod - swagger disabled)
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

knife4j:
  enable: false

# Actuator Configuration (prod - health only)
management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never

# Logging (prod)
logging:
  level:
    com.xindai: WARN
    org.springframework.security: INFO

# CORS 配置 (prod - from environment variable, no default)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 模型服务配置 (prod - from environment variable)
model:
  service:
    url: ${MODEL_SERVICE_URL}
    timeout: 5000

# 第三方数据服务配置 (prod - env vars, all disabled by default)
third-party:
  credit:
    url: ${CREDIT_SERVICE_URL:https://api.credit-bureau.com}
    app-id: ${CREDIT_APP_ID:}
    app-secret: ${CREDIT_APP_SECRET:}
    timeout: 5000
    enabled: false

  zhima:
    url: ${ZHIMA_SERVICE_URL:https://zmopenapi.zmxy.com.cn}
    app-id: ${ZHIMA_APP_ID:}
    private-key: ${ZHIMA_PRIVATE_KEY:}
    public-key: ${ZHIMA_PUBLIC_KEY:}
    timeout: 5000
    enabled: false

  carrier:
    url: ${CARRIER_SERVICE_URL:https://api.carrier.com}
    app-id: ${CARRIER_APP_ID:}
    app-secret: ${CARRIER_APP_SECRET:}
    timeout: 10000
    enabled: false

  social:
    url: ${SOCIAL_SERVICE_URL:https://api.social.com}
    app-id: ${SOCIAL_APP_ID:}
    app-secret: ${SOCIAL_APP_SECRET:}
    timeout: 5000
    enabled: false

# AI 智能助手配置 (prod - from environment variables)
agent:
  enabled: ${AGENT_ENABLED:false}
  base-url: ${AGENT_BASE_URL}
  api-key: ${AGENT_API_KEY}
  model-name: ${AGENT_MODEL_NAME:deepseek-chat}
  temperature: 0.7
  max-tokens: 2048
  timeout-seconds: 60
  memory-max-messages: 20

# 加密密钥 (prod only)
encryption:
  key: ${ENCRYPTION_KEY}
